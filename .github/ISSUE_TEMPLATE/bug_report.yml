name: Bug report
description: Report a problem with Quest Activity Tracker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in the
        details below so we can reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Open the app on the headset
        2. Go to '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: headset
    attributes:
      label: Headset / OS
      description: e.g. Quest 3, Horizon OS v69
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      description: The release tag or build number you installed (e.g. v1.0.0-5)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant `adb logcat` output, if available. This will be automatically
        formatted into code, so no need for backticks.
      render: shell
    validations:
      required: false
