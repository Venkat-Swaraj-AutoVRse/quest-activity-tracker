android.useAndroidX=true

# JVM options for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable the Gradle build cache for faster incremental builds.
org.gradle.caching=true

# NOTE: Do NOT commit org.gradle.java.home here — it is machine-specific.
# Gradle uses your JAVA_HOME / installed JDK (17+ required for AGP 8.2).
